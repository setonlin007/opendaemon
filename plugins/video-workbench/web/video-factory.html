<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0E14">
<title>Video Workbench · OpenDaemon</title>
<style>
:root{
  --bg:#0B0E14;
  --panel:#161B27;
  --ink:#E8EAF0;
  --ink-dim:#8B91A3;
  --coral:#D97757;
  --coral-soft:#E89673;
  --mint:#4ADE80;
  --red:#F87171;
  --line:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Inter","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:1.5;
}
body{display:grid;grid-template-columns:240px 1fr;height:100vh;height:100dvh}

/* 顶部 mobile bar（默认隐藏，<= 768px 显示） */
.mobile-bar{
  display:none;
  position:sticky;top:0;left:0;right:0;z-index:50;
  background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 14px;align-items:center;justify-content:space-between;gap:10px;
}
.mobile-bar h1{font-size:14px;font-weight:700;color:var(--coral)}
.hamburger{
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--ink);font-size:18px;
}
.drawer-mask{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;
  backdrop-filter:blur(2px);
}
.drawer-mask.open{display:block}

/* sidebar */
aside{
  background:var(--panel);border-right:1px solid var(--line);
  padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;
}
aside h1{font-size:15px;font-weight:700;color:var(--coral);letter-spacing:.04em}
aside h1 small{color:var(--ink-dim);font-weight:400}
.btn{
  background:var(--coral);color:#0a0d13;border:none;padding:10px 14px;border-radius:8px;
  font-weight:600;cursor:pointer;font-size:13px;font-family:inherit;width:100%;
  transition:opacity .15s;
}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid var(--red)}
.proj-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.proj-list .item{
  background:rgba(255,255,255,.03);border:1px solid var(--line);
  padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .15s;
}
.proj-list .item:hover{background:rgba(217,119,87,.08);border-color:var(--coral)}
.proj-list .item.active{background:rgba(217,119,87,.15);border-color:var(--coral)}
.proj-list .item .title{font-weight:600;font-size:13px}
.proj-list .item .meta{font-size:11px;color:var(--ink-dim);margin-top:2px}
.proj-list .empty{color:var(--ink-dim);text-align:center;padding:20px 0;font-size:13px}

/* main */
main{padding:32px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:24px;overflow-x:hidden}
.page-hd{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
.page-hd h2{font-size:22px;font-weight:700}
.page-hd .sub{color:var(--ink-dim);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs .tab{
  background:none;border:none;color:var(--ink-dim);padding:10px 16px;cursor:pointer;
  border-bottom:2px solid transparent;font-family:inherit;font-size:13px;font-weight:500;
}
.tabs .tab.active{color:var(--coral);border-bottom-color:var(--coral)}
.tabs .tab:hover{color:var(--ink)}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 24px;
}
.card h3{font-size:15px;font-weight:600;margin-bottom:10px}
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-row label{font-size:12px;color:var(--ink-dim);font-weight:500}
.form-row input,.form-row textarea,.form-row select{
  background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);
  padding:8px 12px;border-radius:6px;font-family:inherit;font-size:13px;
}
.form-row input:focus,.form-row textarea:focus{outline:none;border-color:var(--coral)}
.hint{color:var(--ink-dim);font-size:12px;margin-top:4px}
.row{display:flex;gap:12px}.row > *{flex:1}

.toast{
  position:fixed;bottom:20px;right:20px;
  background:var(--panel);border:1px solid var(--line);padding:12px 16px;border-radius:8px;
  z-index:99;max-width:400px;
}
.toast.success{border-color:var(--mint)}
.toast.error{border-color:var(--red)}

.kbd{
  background:rgba(255,255,255,.08);border:1px solid var(--line);padding:1px 6px;
  border-radius:4px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;
}

/* status pill */
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.02em}
.pill.brief{background:rgba(255,255,255,.08);color:var(--ink-dim)}
.pill.content{background:rgba(74,222,128,.15);color:var(--mint)}
.pill.audio{background:rgba(217,119,87,.18);color:var(--coral)}
.pill.recording{background:rgba(232,150,115,.18);color:var(--coral-soft)}
.pill.archived{background:rgba(248,113,113,.15);color:var(--red)}

/* manifest viewer */
pre.json{
  background:rgba(0,0,0,.3);border:1px solid var(--line);padding:14px 18px;border-radius:8px;
  font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;
  overflow-x:auto;white-space:pre;color:var(--ink-dim);
}
pre.json .key{color:var(--coral)}
pre.json .str{color:var(--mint)}
pre.json .num{color:var(--coral-soft)}

/* ── 移动端适配 (<= 768px) ───────────────────── */
@media (max-width: 768px) {
  body{
    display:flex;flex-direction:column;
  }
  .mobile-bar{display:flex}
  /* sidebar 变成 drawer */
  aside{
    position:fixed;top:0;left:0;bottom:0;z-index:100;
    width:78vw;max-width:320px;
    transform:translateX(-100%);
    transition:transform .25s ease-out;
    box-shadow:4px 0 24px rgba(0,0,0,.5);
  }
  aside.open{transform:translateX(0)}
  main{
    padding:16px 14px 60px;flex:1;gap:16px;
  }
  .page-hd{flex-direction:column;align-items:flex-start;gap:8px;padding-bottom:10px}
  .page-hd h2{font-size:18px}
  .page-hd .sub{font-size:12px;word-break:break-all}
  /* tabs 横向滚动 */
  .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs .tab{flex-shrink:0;padding:10px 14px;font-size:13px}
  /* 卡片更紧凑 */
  .card{padding:14px 16px;border-radius:10px}
  .card h3{font-size:14px}
  /* form 单列 */
  .row{flex-direction:column}
  /* button 更大易点 */
  .btn{padding:12px 14px;font-size:14px;min-height:44px}
  .btn.secondary{min-height:44px}
  /* 表格横向滚动 */
  .card table{display:block;overflow-x:auto;white-space:nowrap}
  /* JSON viewer 缩小 */
  pre.json{font-size:11px;padding:10px 12px;line-height:1.5}
  /* Toast 适配安全区 */
  .toast{bottom:16px;left:16px;right:16px;max-width:none}
}

/* iPhone notch / safe area */
@supports (padding: env(safe-area-inset-top)) {
  body{
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  @media (max-width: 768px) {
    .mobile-bar{padding-top:max(10px, env(safe-area-inset-top))}
  }
}
</style>
</head>
<body>

<div class="mobile-bar">
  <button class="hamburger" id="hamburger" aria-label="菜单">☰</button>
  <h1>🎬 Workbench</h1>
  <div style="width:36px"></div><!-- spacer -->
</div>

<!-- 底部 Status Tray (只在有 active run 时显示) -->
<div id="status-tray" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(217,119,87,.12);border-top:2px solid var(--coral);padding:10px 16px;font-size:13px;backdrop-filter:blur(8px);box-shadow:0 -4px 24px rgba(0,0,0,.4)">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto">
    <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--coral);animation:pulse 1.4s ease-in-out infinite"></span>
    <span id="tray-text" style="flex:1;font-family:'JetBrains Mono',monospace;color:var(--ink);font-size:12px"></span>
    <a id="tray-link" href="#/" style="color:var(--coral);font-weight:600;text-decoration:none">查看 →</a>
  </div>
</div>
<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}</style>
<div class="drawer-mask" id="drawer-mask"></div>

<aside id="sidebar">
  <h1>🎬 Workbench <small>v0.1</small></h1>
  <button class="btn" id="btn-new">+ New Project</button>
  <button class="btn secondary" id="btn-keys">🔑 API Keys</button>
  <div class="proj-list" id="proj-list">
    <div class="empty">loading…</div>
  </div>
  <div style="margin-top:auto;font-size:11px;color:var(--ink-dim);text-align:center;padding-top:14px;border-top:1px solid var(--line)">
    OpenDaemon · Plugin
  </div>
</aside>

<main id="main">
  <div class="page-hd">
    <div>
      <h2 id="page-title">Welcome</h2>
      <div class="sub" id="page-sub">从左边选一个项目，或新建</div>
    </div>
    <div id="page-actions"></div>
  </div>
  <div id="page-body"></div>
</main>

<script>
/* ============================================================
   状态
   ============================================================ */
const state = {
  projects: [],
  currentId: null,
  currentProject: null,
  manifest: null,
};

function $(id){return document.getElementById(id)}
function esc(s){return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m])}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  if (!r.ok) {
    let err;
    try { err = await r.json(); } catch { err = { error: r.statusText }; }
    throw new Error(err.error || `HTTP ${r.status}`);
  }
  return r.json();
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

/* ============================================================
   路由（hash）
   ============================================================ */
function parseHash() {
  const h = location.hash.slice(1) || '/projects';
  const m = h.match(/^\/p\/([\w-]+)(?:\/(\w+))?/);
  if (m) return { page: 'project', id: m[1], tab: m[2] || 'overview' };
  if (h === '/keys') return { page: 'keys' };
  return { page: 'projects' };
}

window.addEventListener('hashchange', () => {
  closeDrawer();  // mobile: 切页时自动收 drawer
  render();
});

/* ============================================================
   Mobile drawer
   ============================================================ */
function openDrawer() {
  $('sidebar').classList.add('open');
  $('drawer-mask').classList.add('open');
}
function closeDrawer() {
  $('sidebar').classList.remove('open');
  $('drawer-mask').classList.remove('open');
}
$('hamburger').onclick = (e) => {
  e.stopPropagation();
  $('sidebar').classList.contains('open') ? closeDrawer() : openDrawer();
};
$('drawer-mask').onclick = closeDrawer;

/* ============================================================
   渲染
   ============================================================ */
async function refreshProjects() {
  const data = await api('/api/vf/projects');
  state.projects = data.projects;
  renderSidebar();
}

function renderSidebar() {
  const cur = parseHash();
  const list = $('proj-list');
  if (!state.projects.length) {
    list.innerHTML = '<div class="empty">还没有项目</div>';
    return;
  }
  list.innerHTML = state.projects.map(p => `
    <div class="item ${cur.page === 'project' && cur.id === p.id ? 'active' : ''}" data-id="${p.id}">
      <div class="title">${esc(p.title)}</div>
      <div class="meta">
        <span class="pill ${esc(p.status)}">${esc(p.status)}</span>
        · ${esc(p.slug)}
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.item').forEach(el => {
    el.onclick = () => { location.hash = `#/p/${el.dataset.id}`; };
  });
}

async function render() {
  const cur = parseHash();
  if (cur.page === 'projects') return renderProjectsPage();
  if (cur.page === 'keys') return renderKeysPage();
  if (cur.page === 'project') return renderProjectPage(cur.id, cur.tab);
}

function renderProjectsPage() {
  $('page-title').textContent = 'Projects';
  $('page-sub').textContent = `${state.projects.length} 个项目`;
  $('page-actions').innerHTML = '';
  $('page-body').innerHTML = state.projects.length
    ? `<div class="card"><p style="color:var(--ink-dim)">从左侧选一个项目，或点 "+ New Project" 新建。</p></div>`
    : `<div class="card">
        <h3>欢迎使用 Video Workbench v0.1</h3>
        <p style="color:var(--ink-dim);margin-top:8px">这是一个把 <code>video-factory</code> skill 包成图形界面的可插拔插件。<br>点左上角 <b>+ New Project</b> 开始第一个视频项目。</p>
       </div>`;
  renderSidebar();
}

function renderKeysPage() {
  $('page-title').textContent = 'API Keys';
  $('page-sub').textContent = '存到独立 vf.db · AES-256-GCM 加密';
  $('page-actions').innerHTML = '';
  loadKeysCard();
}

async function loadKeysCard() {
  try {
    const data = await api('/api/vf/keys');
    const keys = data.keys || [];
    $('page-body').innerHTML = `
      <div class="card">
        <h3>已存 keys</h3>
        ${keys.length
          ? '<table style="width:100%;border-collapse:collapse;margin-top:10px">' +
            '<thead><tr><th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:12px">Provider</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:12px">Label</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:12px">Created</th><th></th></tr></thead><tbody>' +
            keys.map(k => `<tr>
              <td style="padding:6px 8px">${esc(k.provider)}</td>
              <td style="padding:6px 8px">${esc(k.label)}</td>
              <td style="padding:6px 8px;color:var(--ink-dim);font-size:12px">${new Date(k.created_at).toLocaleString()}</td>
              <td style="padding:6px 8px"><button class="btn danger" style="width:auto;padding:4px 10px" onclick="deleteKey('${esc(k.provider)}','${esc(k.label)}')">删除</button></td>
            </tr>`).join('') +
            '</tbody></table>'
          : '<p style="color:var(--ink-dim);margin-top:8px">还没有存任何 key</p>'
        }
      </div>
      <div class="card">
        <h3>添加 / 更新 key</h3>
        <div class="row">
          <div class="form-row">
            <label>Provider</label>
            <select id="key-provider">
              <option value="minimax">MiniMax (T2A v2)</option>
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic</option>
              <option value="volcengine">火山引擎</option>
            </select>
          </div>
          <div class="form-row">
            <label>Label（多个 key 区分）</label>
            <input type="text" id="key-label" value="default">
          </div>
        </div>
        <div class="form-row">
          <label>API Key</label>
          <input type="password" id="key-value" placeholder="sk-...">
          <div class="hint">用 daemon auth password 派生的 AES-256-GCM 加密。不出库时永远是密文。</div>
        </div>
        <button class="btn" onclick="saveKey()">保存</button>
      </div>
    `;
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function saveKey() {
  const provider = $('key-provider').value;
  const label = $('key-label').value || 'default';
  const key = $('key-value').value.trim();
  if (!key) return toast('key 不能为空', 'error');
  try {
    await api('/api/vf/keys', { method: 'POST', body: JSON.stringify({ provider, label, key }) });
    toast('已加密保存', 'success');
    $('key-value').value = '';
    loadKeysCard();
  } catch (e) { toast(e.message, 'error'); }
}

async function deleteKey(provider, label) {
  if (!confirm(`删除 ${provider}/${label}？`)) return;
  try {
    await fetch(`/api/vf/keys/${provider}/${label}`, { method: 'DELETE' });
    toast('已删除', 'success');
    loadKeysCard();
  } catch (e) { toast(e.message, 'error'); }
}

async function renderProjectPage(id, tab) {
  try {
    const data = await api(`/api/vf/projects/${id}`);
    state.currentProject = data.project;
    state.manifest = data.manifest;
    state.currentId = id;

    $('page-title').innerHTML = esc(data.project.title) + ' <span class="pill ' + esc(data.project.status) + '">' + esc(data.project.status) + '</span>';
    $('page-sub').textContent = `slug: ${data.project.slug} · ${data.project.workspace_path}`;
    $('page-actions').innerHTML = `
      <button class="btn danger" style="width:auto;padding:6px 12px" onclick="archiveProject('${id}')">归档</button>
    `;
    $('page-body').innerHTML = `
      <div class="tabs">
        <button class="tab ${tab === 'overview' ? 'active' : ''}" onclick="location.hash='#/p/${id}/overview'">Overview</button>
        <button class="tab ${tab === 'brief' ? 'active' : ''}" onclick="location.hash='#/p/${id}/brief'">Brief</button>
        <button class="tab ${tab === 'content' ? 'active' : ''}" onclick="location.hash='#/p/${id}/content'">Content</button>
        <button class="tab ${tab === 'audio' ? 'active' : ''}" onclick="location.hash='#/p/${id}/audio'">Audio</button>
        <button class="tab ${tab === 'recording' ? 'active' : ''}" onclick="location.hash='#/p/${id}/recording'">Recording</button>
        <button class="tab ${tab === 'publish' ? 'active' : ''}" onclick="location.hash='#/p/${id}/publish'">Publish</button>
      </div>
      <div id="tab-body"></div>
    `;
    renderTabBody(tab, data);
    renderSidebar();
  } catch (e) {
    toast(e.message, 'error');
    $('page-body').innerHTML = `<div class="card"><p style="color:var(--red)">${esc(e.message)}</p></div>`;
  }
}

function renderTabBody(tab, data) {
  const body = $('tab-body');
  if (tab === 'overview') {
    renderOverview(body, data);
    return;
  }
  if (tab === 'brief') {
    body.innerHTML = `
      <div class="card">
        <h3>项目简报</h3>
        <p style="color:var(--ink-dim);margin-bottom:14px">填完保存到 <code>brief.json</code>，Content 阶段会读它。</p>
        <div class="form-row">
          <label>主题</label>
          <input id="brief-topic" type="text" value="${esc(data.project.title)}">
        </div>
        <div class="form-row">
          <label>受众 / 平台</label>
          <input id="brief-audience" type="text" placeholder="如：B 站 + 小红书 · 非技术运营">
        </div>
        <div class="row">
          <div class="form-row">
            <label>目标时长（秒）</label>
            <input id="brief-duration" type="number" value="240" min="60" max="3600">
          </div>
          <div class="form-row">
            <label>风格</label>
            <input id="brief-tone" type="text" placeholder="如：钩子焦虑，主体专业，结尾 CTA">
          </div>
        </div>
        <button class="btn" onclick="saveBrief()">保存简报</button>
      </div>
    `;
    return;
  }
  if (tab === 'audio') return renderAudioTab(body, data);
  if (tab === 'recording') return renderRecordingTab(body, data);
  if (tab === 'publish') return renderPublishTab(body, data);
  if (tab === 'content') return renderContentTab(body, data);

  body.innerHTML = `
    <div class="card">
      <h3>${tab}</h3>
      <p style="color:var(--ink-dim)">这个 tab 还没实现。</p>
    </div>
  `;
}

/* ============================================================
   通用 SSE Runner：发起请求 + 渲染进度条 + 日志面板 + 取消按钮
   ============================================================ */
let __currentRunCtl = null;

async function runPhase({ projectId, url, params = {}, panelEl, onArtifactAdded }) {
  if (__currentRunCtl) {
    toast('已有任务在跑，请先等它完成或取消', 'error');
    return;
  }
  const ctl = { aborted: false, runId: null };
  __currentRunCtl = ctl;

  panelEl.style.display = 'block';
  panelEl.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="flex:1;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;height:10px">
        <div id="run-bar" style="width:0;height:100%;background:var(--coral);transition:width .2s"></div>
      </div>
      <span id="run-pct" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);min-width:80px;text-align:right">init…</span>
      <button class="btn danger" style="width:auto;padding:6px 12px;font-size:12px" onclick="cancelRun()">取消</button>
    </div>
    <div id="run-log" style="background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:6px;padding:10px 12px;height:260px;overflow-y:auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;line-height:1.6"></div>
  `;
  const bar = $('run-bar');
  const pct = $('run-pct');
  const log = $('run-log');

  function appendLog(line, level = 'info') {
    const colorMap = { info: 'var(--ink)', warn: 'var(--coral-soft)', error: 'var(--red)' };
    const ts = new Date().toLocaleTimeString().substring(0, 8);
    const div = document.createElement('div');
    div.style.color = colorMap[level] || 'var(--ink)';
    div.textContent = `[${ts}] ${line}`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || 'request failed');
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let lastEvent = '';

    while (true) {
      if (ctl.aborted) break;
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.substring(0, nl);
        buf = buf.substring(nl + 1);
        if (line.startsWith('event:')) {
          lastEvent = line.substring(6).trim();
        } else if (line.startsWith('data:')) {
          const dataStr = line.substring(5).trim();
          if (!dataStr) continue;
          let data;
          try { data = JSON.parse(dataStr); } catch { continue; }
          handleEvent(lastEvent, data);
        }
      }
    }
  } catch (err) {
    appendLog(`✗ ${err.message}`, 'error');
    toast(err.message, 'error');
  } finally {
    __currentRunCtl = null;
  }

  function handleEvent(name, data) {
    if (name === 'progress') {
      const p = data.m > 0 ? Math.min(100, (data.n / data.m) * 100) : 0;
      bar.style.width = p + '%';
      pct.textContent = `${data.n}/${data.m} · ${data.label || ''}`.substring(0, 80);
      ctl.runId = data.run_id;
    } else if (name === 'log') {
      appendLog(data.line, data.level || 'info');
      ctl.runId = data.run_id || ctl.runId;
    } else if (name === 'done') {
      appendLog(`✓ 完成 · exit ${data.exit_code} · run #${data.run_id}`, 'info');
      bar.style.width = '100%';
      pct.textContent = '✓ done';
      pct.style.color = 'var(--mint)';
      toast('任务完成', 'success');
      // 刷新页面数据
      setTimeout(() => render(), 500);
    } else if (name === 'error') {
      appendLog(`✗ ${data.message || 'error'}`, 'error');
      pct.textContent = '✗ failed';
      pct.style.color = 'var(--red)';
      toast(data.message || 'task failed', 'error');
    } else if (name === 'cancelled') {
      appendLog(`⊘ 已取消`, 'warn');
      pct.textContent = '⊘ cancelled';
      pct.style.color = 'var(--coral-soft)';
    } else if (name === 'artifact_added') {
      appendLog(`✓ 新制品入库 · ${data.type} v${data.version} · ${data.path}`, 'info');
      if (onArtifactAdded) onArtifactAdded(data);
    } else if (name === 'connected') {
      appendLog(`→ 已连接`, 'info');
    }
  }
}

async function cancelRun() {
  if (!__currentRunCtl) return;
  __currentRunCtl.aborted = true;
  if (__currentRunCtl.runId) {
    try {
      await fetch(`/api/vf/runs/${__currentRunCtl.runId}/kill`, { method: 'POST' });
      toast('已请求终止', 'info');
    } catch (e) { /* ignore */ }
  }
}

async function macUpload(projectId) {

    if (!r.ok) throw new Error(d.error || 'upload failed');
    const f = d.files[0];
    $('mac-upload-result').textContent = `✓ ${f.rel_path} · ${formatSize(f.size)}`;

  } catch (e) {
    $('mac-upload-result').textContent = '✗ ' + e.message;

      <button class="btn secondary" onclick="startLint('${projectId}')">▶ 跑 sync-audit --lint</button>
    </div>

    <div class="card">
      <h3>🎨 视觉网页 Scaffold</h3>
      <p style="color:var(--ink-dim);font-size:13px;margin-bottom:12px">
        基于 v9-mac.html 母板生成项目首版 <code>public/index.html</code>。<br/>
        <b style="color:var(--coral-soft)">提示</b>：scenes 数组 / 动画 / scenes mp3 路径会沿用 v9 默认值。要真跑你自己项目，scenes 数组要按你的 audio-segments 重写（这部分仍需手工，或下版本让 Claude 改）。
      </p>
      <div class="row">
        <div class="form-row">
          <label>标题</label>
          <input id="sc-title" type="text" value="${esc(data.project.title)}" placeholder="视频标题">
        </div>
        <div class="form-row">
          <label>主色 (--coral)</label>
          <input id="sc-accent" type="text" value="#D97757" placeholder="#D97757">
        </div>
      </div>
      <button class="btn" onclick="startScaffold('${projectId}')">▶ 生成 public/index.html</button>
    </div>
  `;
}

function startContentGenerate(projectId) {
  if (!confirm('调 Claude SDK 生成 4 个内容文件，约 30s-2min。继续？')) return;
  runPhase({ projectId, url: `/api/vf/projects/${projectId}/content/generate`, panelEl: $('run-panel') });
}

async function startScaffold(projectId) {
  const title = $('sc-title').value.trim() || '';
  const accent = $('sc-accent').value.trim() || '#D97757';
  try {
    const data = await api(`/api/vf/projects/${projectId}/scaffold`, {
      method: 'POST',
      body: JSON.stringify({ title, accent }),
    });
    toast(`✓ 已生成 public/index.html v${data.version}`, 'success');
    setTimeout(() => render(), 500);
  } catch (e) { toast(e.message, 'error'); }
}

/* ============================================================
   Overview tab: Artifact 列表
   ============================================================ */
const ARTIFACT_CONFIG = {
  // 顺序就是显示顺序
  'final':           { label: '🎬 最终成片', preview: 'video', accent: 'coral' },
  'cover':           { label: '🖼 封面候选', preview: 'image', accent: 'mint' },
  'recording':       { label: '📹 录屏原片', preview: 'video', accent: 'coral-soft' },
  'audio':           { label: '🎙 配音 (31 段)', preview: 'audio-dir', accent: 'coral' },
  'script':          { label: '📝 口播稿', preview: 'text', accent: 'mint' },
  'article':         { label: '📄 原文 article', preview: 'text', accent: 'ink-dim' },
  'outline':         { label: '🗂 outline', preview: 'text', accent: 'ink-dim' },
  'audio-segments':  { label: '🎚 audio-segments.json', preview: 'json', accent: 'ink-dim' },
  'timing':          { label: '⏱ timing.json', preview: 'json', accent: 'ink-dim' },
  'script-v6':       { label: '📝 script-v6', preview: 'text', accent: 'ink-dim' },
};

function renderOverview(body, data) {
  const versions = data.versions || [];
  // 按 type 分组
  const byType = {};
  for (const v of versions) {
    if (!byType[v.artifact_type]) byType[v.artifact_type] = [];
    byType[v.artifact_type].push(v);
  }
  // 排序：每个 type 按 version desc
  for (const type in byType) {
    byType[type].sort((a, b) => b.version - a.version);
  }

  // 按 ARTIFACT_CONFIG 顺序输出（未配置的 type 放最后）
  const orderedTypes = [
    ...Object.keys(ARTIFACT_CONFIG).filter(t => byType[t]),
    ...Object.keys(byType).filter(t => !ARTIFACT_CONFIG[t]),
  ];

  let html = '';

  // 制品卡片
  for (const type of orderedTypes) {
    html += renderArtifactCard(type, byType[type], data.project);
  }

  // 没制品时占位
  if (orderedTypes.length === 0) {
    html += `<div class="card"><p style="color:var(--ink-dim)">还没有任何制品。从 Brief tab 开始，逐步推进。</p></div>`;
  }

  // 最近运行
  html += `
    <div class="card">
      <h3>最近运行</h3>
      ${(data.runs || []).length
        ? '<table style="width:100%;border-collapse:collapse;margin-top:8px"><thead><tr><th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:12px">Phase</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:12px">Status</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:12px">Time</th></tr></thead><tbody>' +
          (data.runs || []).map(r => `<tr>
            <td style="padding:6px 8px">${esc(r.phase)}</td>
            <td style="padding:6px 8px">${esc(r.status)}</td>
            <td style="padding:6px 8px;color:var(--ink-dim);font-size:12px">${r.started_at ? new Date(r.started_at).toLocaleString() : '-'}</td>
          </tr>`).join('') + '</tbody></table>'
        : '<p style="color:var(--ink-dim);margin-top:8px">还没运行过任何 phase</p>'
      }
    </div>

    <details>
      <summary style="cursor:pointer;color:var(--ink-dim);padding:8px 0">📋 manifest.json (点击展开)</summary>
      <pre class="json" style="margin-top:8px">${syntaxJson(JSON.stringify(data.manifest || {}, null, 2))}</pre>
    </details>
  `;

  body.innerHTML = html;
}

function renderArtifactCard(type, versions, project) {
  const cfg = ARTIFACT_CONFIG[type] || { label: type, preview: 'none', accent: 'ink-dim' };
  const live = versions.filter(v => !v.is_trashed);
  const current = live.find(v => v.is_current) || live[0];
  const older = live.filter(v => v !== current);

  // ── Current 大预览 ──
  let previewHtml = '';
  if (current) {
    const url = `/api/vf/projects/${project.id}/files/${encodeURI(current.file_rel_path)}`;
    if (cfg.preview === 'video') {
      previewHtml = `
        <video controls preload="metadata" style="width:100%;max-height:420px;border-radius:8px;background:#000;margin-bottom:8px">
          <source src="${url}" type="video/mp4">
        </video>
      `;
    } else if (cfg.preview === 'image') {
      // Current 大图
      previewHtml = `
        <a href="${url}" target="_blank" style="display:block;margin-bottom:8px">
          <img src="${url}" style="max-width:280px;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:2px solid var(--coral)" loading="lazy">
        </a>
      `;
    } else if (cfg.preview === 'audio-dir') {
      const meta = current.metadata_json ? safeParse(current.metadata_json) : {};
      const files = meta.files || [];
      previewHtml = `
        <details style="margin-bottom:8px">
          <summary style="cursor:pointer;color:var(--ink-dim);font-size:12px">▸ ${files.length} 段 mp3 (展开试听)</summary>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:8px">
            ${files.slice(0, 31).map(f => {
              const u = `/api/vf/projects/${project.id}/files/${encodeURI(f)}`;
              return `<div style="background:rgba(255,255,255,.03);padding:6px 8px;border-radius:6px;font-size:12px">
                <div style="color:var(--ink-dim);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.replace('public/audio/', ''))}</div>
                <audio controls preload="none" src="${u}" style="width:100%;height:30px"></audio>
              </div>`;
            }).join('')}
          </div>
        </details>
      `;
    }
  }

  // ── Current 的版本行（始终显示） ──
  const currentRow = current ? renderVersionRow(current, type, project, true) : '';

  // ── 旧版本行（默认折叠） ──
  const olderRows = older.map(v => renderVersionRow(v, type, project, false)).join('');

  const olderSection = older.length ? `
    <details style="margin-top:10px">
      <summary style="cursor:pointer;color:var(--ink-dim);font-size:12px;padding:6px 0;user-select:none">
        ▸ 其他 ${older.length} 个旧版本
      </summary>
      <table style="width:100%;border-collapse:collapse;margin-top:6px">
        <thead><tr>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:11px;font-weight:500">版本</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:11px;font-weight:500">路径</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:11px;font-weight:500">大小</th>
          <th></th>
        </tr></thead>
        <tbody>${olderRows}</tbody>
      </table>
    </details>
  ` : '';

  // ── 当前版本紧凑信息条 ──
  const currentMeta = current ? safeParse(current.metadata_json || "{}") : {};
  const sizeStr = currentMeta.size ? formatSize(currentMeta.size)
                : currentMeta.count ? `${currentMeta.count} 个文件`
                : '-';
  const currentBar = current ? `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:rgba(217,119,87,.06);border:1px solid rgba(217,119,87,.25);border-radius:8px;font-size:13px">
      <span class="pill content">★ current · v${current.version}</span>
      <span style="color:var(--ink-dim);font-size:12px;flex:1;min-width:200px;word-break:break-all">${esc(current.file_rel_path)}</span>
      <span style="color:var(--ink-dim);font-size:12px;white-space:nowrap">${sizeStr}</span>
      <span style="display:inline-flex;gap:4px">
        <a href="/api/vf/projects/${project.id}/files/${encodeURI(current.file_rel_path)}" target="_blank" class="btn secondary" style="width:auto;padding:4px 10px;font-size:12px;text-decoration:none">预览</a>
        <a href="/api/vf/projects/${project.id}/files/${encodeURI(current.file_rel_path)}?download=1" download class="btn secondary" style="width:auto;padding:4px 10px;font-size:12px;text-decoration:none">下载</a>
      </span>
    </div>
  ` : '';

  return `
    <div class="card">
      <h3>${cfg.label} <span style="color:var(--ink-dim);font-size:12px;font-weight:400;margin-left:6px">${live.length} 个版本</span></h3>
      ${previewHtml}
      ${currentBar}
      ${olderSection}
    </div>
  `;
}

function renderVersionRow(v, type, project, isCurrent) {
  const meta = safeParse(v.metadata_json || "{}");
  const url = `/api/vf/projects/${project.id}/files/${encodeURI(v.file_rel_path)}`;
  const dlUrl = `${url}${url.includes('?') ? '&' : '?'}download=1`;
  const sizeStr = meta.size ? formatSize(meta.size) : (meta.count ? `${meta.count} 个文件` : '-');
  return `<tr>
    <td style="padding:6px 8px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap">v${v.version}${isCurrent ? ' <span class="pill content" style="margin-left:4px">★</span>' : ''}</td>
    <td style="padding:6px 8px;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink-dim);word-break:break-all">${esc(v.file_rel_path)}</td>
    <td style="padding:6px 8px;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink-dim);white-space:nowrap">${sizeStr}</td>
    <td style="padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap">
      <a href="${url}" target="_blank" class="btn secondary" style="width:auto;padding:3px 8px;font-size:11px;display:inline-block;text-decoration:none;margin-right:3px">预览</a>
      <a href="${dlUrl}" download class="btn secondary" style="width:auto;padding:3px 8px;font-size:11px;display:inline-block;text-decoration:none;margin-right:3px">下载</a>
      ${!isCurrent ? `<button class="btn" style="width:auto;padding:3px 8px;font-size:11px" onclick="switchCurrent('${project.id}','${esc(type)}',${v.version})">设 current</button>` : ''}
    </td>
  </tr>`;
}

async function switchCurrent(projectId, type, version) {
  try {
    await api(`/api/vf/projects/${projectId}/versions/${type}/${version}/switch`, { method: 'POST' });
    toast(`${type} → v${version} (current)`, 'success');
    render();
  } catch (e) { toast(e.message, 'error'); }
}

function safeParse(s) { try { return JSON.parse(s); } catch { return {}; } }
function formatSize(bytes) {
  if (!bytes) return '-';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
  return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}

async function saveBrief() {
  const data = {
    topic: $('brief-topic').value,
    audience: $('brief-audience').value,
    duration_target_s: parseInt($('brief-duration').value, 10) || 240,
    tone: $('brief-tone').value,
  };
  try {
    await api(`/api/vf/projects/${state.currentId}/brief`, {
      method: 'PUT',
      body: JSON.stringify(data),
    });
    toast('已保存 brief.json', 'success');
    refreshProjects();
    render();
  } catch (e) { toast(e.message, 'error'); }
}

async function archiveProject(id) {
  if (!confirm('归档这个项目？(目录文件不删，可以以后回收)')) return;
  try {
    await fetch(`/api/vf/projects/${id}`, { method: 'DELETE' });
    toast('已归档', 'success');
    location.hash = '#/projects';
    refreshProjects();
  } catch (e) { toast(e.message, 'error'); }
}

/* ============================================================
   新建项目
   ============================================================ */
$('btn-new').onclick = async () => {
  const slug = prompt('项目 slug（a-z 0-9 - 仅小写，决定目录名）');
  if (!slug) return;
  const title = prompt('项目标题');
  if (!title) return;
  try {
    const data = await api('/api/vf/projects', {
      method: 'POST',
      body: JSON.stringify({ slug, title }),
    });
    toast(`项目已创建 → ~/workspace/projects/${slug}/`, 'success');
    await refreshProjects();
    location.hash = `#/p/${data.project.id}/brief`;
  } catch (e) { toast(e.message, 'error'); }
};

$('btn-keys').onclick = () => location.hash = '#/keys';

/* ============================================================
   JSON 着色
   ============================================================ */
function syntaxJson(str) {
  return esc(str)
    .replace(/(&quot;.*?&quot;)(\s*:)/g, '<span class="key">$1</span>$2')
    .replace(/:\s*(&quot;.*?&quot;)/g, ': <span class="str">$1</span>')
    .replace(/:\s*(\d+)/g, ': <span class="num">$1</span>');
}

/* ============================================================
   Status Tray 轮询
   ============================================================ */
async function pollActiveRuns() {
  try {
    const data = await api('/api/vf/active-runs');
    const runs = data.runs || [];
    const tray = $('status-tray');
    if (runs.length === 0) {
      tray.style.display = 'none';
      return;
    }
    tray.style.display = 'block';
    const r = runs[0]; // 第一个
    const dur = r.started_at ? Math.floor((Date.now() - r.started_at) / 1000) : 0;
    const more = runs.length > 1 ? ` · +${runs.length - 1} 个其他任务` : '';
    $('tray-text').textContent = `▶ ${r.title} · ${r.phase} · ${dur}s${more}`;
    $('tray-link').href = `#/p/${r.project_id}/${phaseToTab(r.phase)}`;
  } catch {
    /* silent */
  }
}
function phaseToTab(phase) {
  if (phase === 'audio' || phase === 'lint') return 'audio';
  if (phase === 'recording') return 'recording';
  if (phase === 'encode') return 'publish';
  if (phase === 'build-timing') return 'recording';
  return 'overview';
}
setInterval(pollActiveRuns, 3000);

/* ============================================================
   bootstrap
   ============================================================ */
(async () => {
  try {
    await refreshProjects();
    await render();
    pollActiveRuns();
  } catch (e) {
    if (e.message.includes('unauthorized')) {
      location.href = '/login.html';
    } else {
      toast(e.message, 'error');
    }
  }
})();
</script>
</body>
</html>
